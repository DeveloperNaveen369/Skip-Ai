name: Build Signed Release APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > skip-ai-release.jks

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Git commit
        run: |
          echo "Commit being built:"
          git log -1 --oneline

      - name: Check versionCode in source
        run: |
          echo "=== versionCode references ==="
          grep -R "versionCode" . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            || true

          echo "=== versionName references ==="
          grep -R "versionName" . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            || true

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/skip-ai-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease bundleRelease

      - name: Check generated APK and AAB
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -print || true

          echo "=== AAB files ==="
          find app/build/outputs/bundle -type f -print || true

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Skip-AI-v1.0.1.apk

      - name: Rename AAB
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/Skip-AI-v1.0.1.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Skip-AI-v1.0.1
          path: |
            app/build/outputs/apk/release/Skip-AI-v1.0.1.apk
            app/build/outputs/bundle/release/Skip-AI-v1.0.1.aab
